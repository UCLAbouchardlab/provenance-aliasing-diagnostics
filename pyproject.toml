[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-aliasing-diagnostics"
version = "0.1.0.dev0"
description = "Metadata-based diagnostics of provenance and group-label aliasing."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.25,<3",
  "pandas>=2.0,<3",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
advanced = ["scipy>=1.10,<2"]
excel = ["openpyxl>=3.1,<4"]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
provenance-aliasing = "provenance_aliasing.api.cli:main"

[tool.setuptools]
packages = ["provenance_aliasing", "provenance_aliasing.adapters", "provenance_aliasing.api"]

[tool.setuptools.package-dir]
provenance_aliasing = "core"
"provenance_aliasing.api" = "api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::RuntimeWarning"]
