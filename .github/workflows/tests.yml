name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        run: python -m pip install ".[dev,excel]"
      - name: Run complete tests against installed package
        run: python -m pytest

  package:
    name: Validate distributions and clean wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python scripts/check_dist.py
      - name: Install wheel without extras in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/package-venv"
          "$RUNNER_TEMP/package-venv/bin/python" -m pip install dist/*.whl
      - name: Smoke-test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/package-venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"'
      - name: Check optional Excel support separately
        working-directory: ${{ runner.temp }}
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/dist" -name '*.whl')
          "$RUNNER_TEMP/package-venv/bin/python" -m pip install "${wheel}[excel]"
          "$RUNNER_TEMP/package-venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_wheel.py" --excel
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
