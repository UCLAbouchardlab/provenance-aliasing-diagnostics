name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/tests.yml

  metadata:
    name: Validate approved release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require license, citation and matching version tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install cffconvert pyyaml
          cffconvert --validate
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          import yaml
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          citation = yaml.safe_load(Path('CITATION.cff').read_text())
          assert Path('LICENSE').read_text().strip(), 'Louis must supply LICENSE'
          assert project['license'] == 'MIT'
          assert project['license-files'] == ['LICENSE']
          assert citation['license'] == 'MIT'
          assert citation['version'] == project['version']
          assert citation['repository-code'] == project['urls']['Repository']
          assert os.environ['RELEASE_TAG'] == 'v' + project['version']
          PY

  publish:
    name: Publish approved distributions to PyPI
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
    needs: [checks, metadata]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/provenance-aliasing-diagnostics
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
